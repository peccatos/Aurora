[package]
name = "aurora-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# wasm-opt crashes on this binary (large Symphonia graph); skip it —
# the release profile already optimizes.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
aurora-core.workspace = true
aurora-kernel.workspace = true
aurora-audio.workspace = true
aurora-dsp.workspace = true
aurora-loudness.workspace = true
aurora-decoder.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
tracing.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
