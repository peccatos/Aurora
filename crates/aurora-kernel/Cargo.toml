[package]
name = "aurora-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aurora-core.workspace = true
aurora-decoder.workspace = true
aurora-dsp.workspace = true
aurora-vst.workspace = true
aurora-metadata.workspace = true
aurora-storage.workspace = true
aurora-library.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
notify.workspace = true

[target.'cfg(windows)'.dependencies]
# WASAPI exclusive path on Windows builds (default on for the desktop
# app; off on other platforms — see aurora-audio's win-wasapi feature).
aurora-audio = { workspace = true, features = ["win-wasapi"] }

[target.'cfg(not(windows))'.dependencies]
aurora-audio.workspace = true

[features]
# Mirrors aurora-audio's win-wasapi: enabled by the Windows target
# dependency (which requests the feature) so kernel cfg gates line up.
win-wasapi = ["aurora-audio/win-wasapi"]

[lints]
workspace = true
