[package]
name = "aurora-kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aurora-core.workspace = true
aurora-decoder.workspace = true
aurora-dsp.workspace = true
aurora-metadata.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Native (desktop) extras: VST hosting, SQLite persistence, folder
# watcher, full tokio. The wasm build (Aurora Web) keeps the music core
# (engine/DSP/BPM/queue/metadata); storage is IndexedDB on the JS side,
# VST is impossible in a browser, and FS watching has no filesystem.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
aurora-vst.workspace = true
aurora-storage.workspace = true
aurora-library.workspace = true
notify.workspace = true
tokio.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# Declared directly (not workspace = true): dependency features are additive,
# so inheriting the workspace entry would drag `net`/`process` (and mio,
# which hard-errors on wasm) into the browser build.
tokio = { version = "1", default-features = false, features = ["sync", "macros", "time"] }
aurora-audio.workspace = true

[target.'cfg(windows)'.dependencies]
# WASAPI exclusive path on Windows builds (default on for the desktop
# app; off on other platforms — see aurora-audio's win-wasapi feature).
aurora-audio = { workspace = true, features = ["win-wasapi"] }

[target.'cfg(all(not(windows), not(target_family = "wasm")))'.dependencies]
aurora-audio.workspace = true

[features]
# Mirrors aurora-audio's win-wasapi: enabled by the Windows target
# dependency (which requests the feature) so kernel cfg gates line up.
win-wasapi = ["aurora-audio/win-wasapi"]

[lints]
workspace = true
