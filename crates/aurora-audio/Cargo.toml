[package]
name = "aurora-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aurora-core.workspace = true
aurora-decoder.workspace = true
aurora-dsp.workspace = true
ringbuf.workspace = true
rustfft.workspace = true
serde.workspace = true
symphonia.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Native (non-wasm) audio path: CPAL output + VST3 hosting.
# The wasm build (Aurora Web) drives output from an AudioWorklet on the
# JS side and has no native plugins — both are off there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
cpal.workspace = true
aurora-vst.workspace = true

[dev-dependencies]
hound.workspace = true
proptest.workspace = true
tempfile.workspace = true

[features]
# WASAPI exclusive output + loopback verification. Defaulted ON for
# Windows targets via the platform dependency in aurora-kernel; other
# platforms build the shared CPAL path (the exclusive APIs honestly
# return "unavailable" — ADR 0002, never a fake verdict).
default = []
win-wasapi = ["dep:windows"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Devices_Properties", "Win32_Media_KernelStreaming", "Win32_System_Threading", "Win32_Foundation"] }

[lints]
workspace = true
