name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bundle · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Stage VST helper binaries (externalBin)
        shell: bash
        run: |
          cargo build --workspace --bins --exclude aurora-desktop
          mkdir -p apps/desktop/binaries
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          case "$TRIPLE" in *windows*) EXT=".exe";; esac
          for name in vst3-host-helper vst3-host-probe vst-gui-helper; do
            test -f "target/debug/$name$EXT" || { echo "Missing helper binary: $name$EXT"; exit 1; }
            cp "target/debug/$name$EXT" "apps/desktop/binaries/$name-$TRIPLE$EXT"
          done
          ls -la apps/desktop/binaries/

      - name: Typecheck frontend
        run: npm --prefix frontend exec tsc -- --noEmit

      - name: Validate workspace (fmt + clippy + tests)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build release bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Aurora ${{ github.ref_name }}"
          releaseBody: "See the assets to download the installer for your platform. Signed artifacts require the signing secrets (see docs/PLATFORM_LIMITATIONS.md)."
          releaseDraft: true
          prerelease: false
