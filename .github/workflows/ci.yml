name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Fast lane (every push to main, every PR): linux rust check + frontend
# build/test + security audit.
# Slow lane (heavyweight: 3-OS matrix, MSRV, Tauri bundle): tags (v*),
# manual workflow_dispatch, or the `bundle` / `full-matrix` labels on a PR.
# github.event.label.name is only set on labeled/unlabeled events; for other
# PR events the label set is read from github.event.pull_request.labels.
# NOTE: job-level `if` cannot use the `env` context, so the gate expression
# is repeated verbatim on each slow-lane job.

jobs:
  # ---------------- fast lane ----------------

  rust-linux:
    name: Rust · linux (fast)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - uses: ./.github/actions/stage-vst-bins

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  # ---------------- slow lane (labels / dispatch / tags) ----------------

  rust-other-os:
    name: Rust · ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(join(github.event.pull_request.labels.*.name, ','), 'bundle') || contains(join(github.event.pull_request.labels.*.name, ','), 'full-matrix') || github.event.label.name == 'bundle' || github.event.label.name == 'full-matrix'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/stage-vst-bins

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV · ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(join(github.event.pull_request.labels.*.name, ','), 'bundle') || contains(join(github.event.pull_request.labels.*.name, ','), 'full-matrix') || github.event.label.name == 'bundle' || github.event.label.name == 'full-matrix'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/stage-vst-bins
      - name: Check workspace at MSRV
        run: cargo check --workspace

  bundle:
    name: Bundle · ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(join(github.event.pull_request.labels.*.name, ','), 'bundle') || contains(join(github.event.pull_request.labels.*.name, ','), 'full-matrix') || github.event.label.name == 'bundle' || github.event.label.name == 'full-matrix'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: "--bundles deb,appimage"
          - os: windows-latest
            args: "--bundles nsis,msi"
          - os: macos-latest
            args: "--bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - uses: ./.github/actions/stage-vst-bins
      - name: Bundle desktop application
        # Run tauri CLI from apps/desktop (its config dir): tauri-cli
        # resolves the project relative to its own cwd.
        run: npx --prefix ../../frontend tauri build --bundles ${{ matrix.args }}
        working-directory: apps/desktop
      - name: Upload artifacts (Linux/Windows)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-bundle-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-bundle-macos-latest
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
