name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Stage VST helper binaries (externalBin)
        # externalBin files are gitignored build artifacts; tauri-build
        # requires them in the checkout. Dependency bins (vst3-host-*)
        # need an explicit --bins build to exist in target/debug.
        shell: bash
        run: |
          cargo build --workspace --bins --exclude aurora-desktop
          mkdir -p apps/desktop/binaries
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          case "$TRIPLE" in *windows*) EXT=".exe";; esac
          for name in vst3-host-helper vst3-host-probe vst-gui-helper; do
            if [ -f "target/debug/$name$EXT" ]; then
              cp "target/debug/$name$EXT" "apps/desktop/binaries/$name-$TRIPLE$EXT"
            fi
          done
          if [ -f "bin/yt-dlp$EXT" ]; then
            cp "bin/yt-dlp$EXT" "apps/desktop/binaries/yt-dlp-$TRIPLE$EXT"
          fi
          test -f "apps/desktop/binaries/yt-dlp-$TRIPLE$EXT"
          ls -la apps/desktop/binaries/ || true
      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - name: Stage VST helper binaries (externalBin)
        # externalBin files are gitignored build artifacts; tauri-build
        # requires them in the checkout. Dependency bins (vst3-host-*)
        # need an explicit --bins build to exist in target/debug.
        shell: bash
        run: |
          cargo build --workspace --bins --exclude aurora-desktop
          mkdir -p apps/desktop/binaries
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          case "$TRIPLE" in *windows*) EXT=".exe";; esac
          for name in vst3-host-helper vst3-host-probe vst-gui-helper; do
            if [ -f "target/debug/$name$EXT" ]; then
              cp "target/debug/$name$EXT" "apps/desktop/binaries/$name-$TRIPLE$EXT"
            fi
          done
          if [ -f "bin/yt-dlp$EXT" ]; then
            cp "bin/yt-dlp$EXT" "apps/desktop/binaries/yt-dlp-$TRIPLE$EXT"
          fi
          test -f "apps/desktop/binaries/yt-dlp-$TRIPLE$EXT"
          ls -la apps/desktop/binaries/ || true
      - name: Check workspace at MSRV
        run: cargo check --workspace

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  bundle:
    name: Bundle · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: "--bundles deb,appimage"
          - os: windows-latest
            args: "--bundles nsis,msi"
          - os: macos-latest
            args: "--bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Stage VST helper binaries (externalBin)
        # externalBin files are gitignored build artifacts; tauri-build
        # requires them in the checkout. Dependency bins (vst3-host-*)
        # need an explicit --bins build to exist in target/debug.
        shell: bash
        run: |
          cargo build --workspace --bins --exclude aurora-desktop
          mkdir -p apps/desktop/binaries
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          EXT=""
          case "$TRIPLE" in *windows*) EXT=".exe";; esac
          for name in vst3-host-helper vst3-host-probe vst-gui-helper; do
            if [ -f "target/debug/$name$EXT" ]; then
              cp "target/debug/$name$EXT" "apps/desktop/binaries/$name-$TRIPLE$EXT"
            fi
          done
          if [ -f "bin/yt-dlp$EXT" ]; then
            cp "bin/yt-dlp$EXT" "apps/desktop/binaries/yt-dlp-$TRIPLE$EXT"
          fi
          test -f "apps/desktop/binaries/yt-dlp-$TRIPLE$EXT"
          ls -la apps/desktop/binaries/ || true
      - name: Bundle desktop application
        # Run tauri CLI from apps/desktop (its config dir): tauri-cli
        # resolves the project relative to its own cwd.
        run: npx --prefix ../../frontend tauri build --bundles ${{ matrix.args }}
        working-directory: apps/desktop
      - name: Upload artifacts (Linux/Windows)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-bundle-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-bundle-macos-latest
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
