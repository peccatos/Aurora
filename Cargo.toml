[workspace]
resolver = "3"
members = [
    "crates/aurora-core",
    "crates/aurora-providers",
    "crates/aurora-decoder",
    "crates/aurora-dsp",
    "crates/aurora-loudness",
    "crates/aurora-vst",
    "crates/aurora-audio",
    "crates/aurora-metadata",
    "crates/aurora-storage",
    "crates/aurora-library",
    "crates/aurora-kernel",
    "crates/aurora-web",
    "crates/aurora-tauri",
    "crates/aurora-api",
    "crates/aurora-app",
    "apps/desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
aurora-core = { path = "crates/aurora-core" }
aurora-providers = { path = "crates/aurora-providers" }
aurora-decoder = { path = "crates/aurora-decoder" }
aurora-dsp = { path = "crates/aurora-dsp" }
aurora-loudness = { path = "crates/aurora-loudness" }
aurora-vst = { path = "crates/aurora-vst" }
aurora-audio = { path = "crates/aurora-audio" }
aurora-metadata = { path = "crates/aurora-metadata" }
aurora-storage = { path = "crates/aurora-storage" }
aurora-library = { path = "crates/aurora-library" }
aurora-kernel = { path = "crates/aurora-kernel" }
aurora-web = { path = "crates/aurora-web" }
aurora-tauri = { path = "crates/aurora-tauri" }
aurora-api = { path = "crates/aurora-api" }
aurora-app = { path = "crates/aurora-app" }

# Audio stack
cpal = "0.18.2"
rustfft = "6.4.1"
vst3-host = { version = "0.10", default-features = false, features = ["process-isolation"] }
symphonia = { version = "0.6.1", features = ["all"] }
rubato = "5.0.1"
ringbuf = "0.6.0"
lofty = "0.25.5"
blake3 = "1"
aes-gcm = "0.10"

# Runtime / persistence
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time", "net", "io-util", "process"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "migrate", "macros", "chrono", "uuid"] }

# Desktop
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Media_KernelStreaming"] }
tauri = "2.12.5"
keyring = { version = "4.2.0", default-features = true }
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"

# Process control (Unix termination signals; no-op on Windows)
ctrlc = "3.5"

# Shared infrastructure
serde = { version = "1", features = ["derive"] }
url = "2.5"
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
thiserror = "2"
base64 = "0.22"
argon2 = "0.5"
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
notify = "8"

tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }

# Tests
tempfile = "3"
proptest = "1"
hound = "3.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package.symphonia]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
